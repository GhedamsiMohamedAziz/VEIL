[project]
name = "veil"
version = "0.1.0"
description = "VEIL - make machine perception measurable"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "pillow>=10.0",
    "reportlab>=4.0",
    "torch>=2.2",
    "torchvision>=0.17",
]

[project.optional-dependencies]
camera = ["opencv-python>=4.9"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
veil = "veil.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# piggy: syntax errors and pyflakes only - the checks that catch bugs. Widen
# once the codebase is clean under them.
select = ["E9", "F"]

[tool.hatch.build.targets.wheel]
packages = ["veil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs model weights"]
filterwarnings = ["ignore::DeprecationWarning"]
